<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flat Util Tests</title>
    <link rel="stylesheet" href="node_modules/mocha/mocha.css">
</head>
<body>
    <div id="mocha"></div>

    <!-- Testing libraries -->
    <script src="node_modules/mocha/mocha.js"></script>
    <script src="umd/index.js"></script>
    <script type="module">
        import * as chai from './node_modules/chai/chai.js';

        window.chai = chai;
        window.testResult = import('./test.js').then(() => new Promise(resolve => {
            const log = (type, msg) => console.log(JSON.stringify({ type, msg }));
            const runner = mocha.run(resolve);
            runner
                .on('test', test => log('test', `Running: ${test.title}`))
                .on('pass', test => log('pass', `✓ ${test.title}`))
                .on('fail', (test, error) => log('fail', `✗ ${test.title}\n   ${error.message}`))
                .on('end', () => log('end', JSON.stringify(runner.stats)));
        }));
    </script>
</body>
</html>
